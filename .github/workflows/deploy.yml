name: Validate and deploy Endurance

on:
  push:
    branches:
      - v4
  pull_request:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Quartz
        run: npx quartz build

      - name: Publish Google verification file
        run: cp .github/google22975f70551c2949.html public/google22975f70551c2949.html

      - name: Check generated links and SEO
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { promises as fs } from "node:fs"
          import path from "node:path"

          const outputRoot = path.resolve(process.env.SITE_OUTPUT ?? "public")
          const siteOrigin = "https://endurancege.ru"
          const failures = []

          async function walk(directory, prefix = "") {
            const entries = await fs.readdir(directory, { withFileTypes: true })
            const nested = await Promise.all(
              entries.map(async (entry) => {
                const relativePath = path.posix.join(prefix, entry.name)
                return entry.isDirectory()
                  ? walk(path.join(directory, entry.name), relativePath)
                  : [relativePath]
              }),
            )
            return nested.flat()
          }

          const files = await walk(outputRoot)
          const fileSet = new Set(files)
          const htmlFiles = files.filter((file) => file.endsWith(".html"))
          const htmlCache = new Map()

          function decodeUrlPath(pathname) {
            try {
              return decodeURIComponent(pathname)
            } catch {
              return pathname
            }
          }

          function routeFor(file) {
            if (file === "index.html") return "/"
            if (file.endsWith("/index.html")) return `/${file.slice(0, -"index.html".length)}`
            return `/${file.slice(0, -".html".length)}`
          }

          function outputFor(pathname) {
            const relativePath = decodeUrlPath(pathname).replace(/^\/+/, "")
            const candidates = relativePath.length === 0
              ? ["index.html"]
              : pathname.endsWith("/")
                ? [`${relativePath.replace(/\/$/, "")}/index.html`]
                : [relativePath, `${relativePath}.html`, `${relativePath}/index.html`]
            return candidates.find((candidate) => fileSet.has(candidate))
          }

          async function readHtml(file) {
            if (!htmlCache.has(file)) {
              htmlCache.set(file, await fs.readFile(path.join(outputRoot, file), "utf8"))
            }
            return htmlCache.get(file)
          }

          function attributeValues(html, attribute) {
            const pattern = new RegExp(`\\b${attribute}=["']([^"']+)["']`, "gi")
            return [...html.matchAll(pattern)].map((match) => match[1])
          }

          function attributeValue(element, attribute) {
            const escapedAttribute = attribute.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
            return element.match(new RegExp(`\\b${escapedAttribute}=["']([^"']+)["']`, "i"))?.[1]
          }

          function hasClass(element, className) {
            return (attributeValue(element, "class") ?? "").split(/\s+/).includes(className)
          }

          function hasAccessibleName(element, documentIds) {
            if (attributeValue(element, "aria-label")?.trim()) return true
            const labelledBy = attributeValue(element, "aria-labelledby")?.trim().split(/\s+/) ?? []
            if (labelledBy.length > 0 && labelledBy.every((id) => documentIds.has(id))) return true

            const text = element
              .replace(/<[^>]+>/g, " ")
              .replace(/&(?:nbsp|#160);/gi, " ")
              .trim()
            return text.length > 0
          }

          function checkControlledButtons(html, file, className, documentIds, required) {
            const buttons = [...html.matchAll(/<button\b[^>]*>[\s\S]*?<\/button>/gi)]
              .map((match) => match[0])
              .filter((button) => hasClass(button, className))

            if (required && buttons.length === 0) {
              failures.push(`${file}: missing .${className} button`)
            }

            for (const button of buttons) {
              if (!hasAccessibleName(button, documentIds)) {
                failures.push(`${file}: .${className} button has no accessible name`)
              }

              const controls = attributeValue(button, "aria-controls")?.trim().split(/\s+/) ?? []
              if (controls.length === 0) {
                failures.push(`${file}: .${className} button has no aria-controls`)
              } else {
                for (const controlledId of controls) {
                  if (!documentIds.has(controlledId)) {
                    failures.push(`${file}: .${className} controls missing #${controlledId}`)
                  }
                }
              }
            }
          }

          async function checkReference(rawReference, sourceFile, sourceRoute) {
            const reference = rawReference.replace(/&amp;/g, "&").trim()
            if (!reference || /^(?:data|mailto|tel|javascript|blob):/i.test(reference)) return

            let url
            try {
              url = new URL(reference, `${siteOrigin}${sourceRoute}`)
            } catch {
              failures.push(`${sourceFile}: invalid URL ${reference}`)
              return
            }

            if (!/^https?:$/.test(url.protocol) || url.origin !== siteOrigin) return
            const targetFile = outputFor(url.pathname)
            if (!targetFile) {
              failures.push(`${sourceFile}: missing target ${reference}`)
              return
            }

            if (url.hash && targetFile.endsWith(".html")) {
              let fragment = url.hash.slice(1)
              try {
                fragment = decodeURIComponent(fragment)
              } catch {}
              if (!fragment || fragment.startsWith(":~:text=")) return

              const targetHtml = await readHtml(targetFile)
              const ids = new Set(attributeValues(targetHtml, "id"))
              if (!ids.has(fragment)) {
                failures.push(`${sourceFile}: missing anchor ${reference}`)
              }
            }
          }

          for (const file of htmlFiles) {
            const html = await readHtml(file)
            const route = routeFor(file)
            const references = attributeValues(html, "href")
              .concat(attributeValues(html, "src"), attributeValues(html, "poster"))

            for (const srcset of attributeValues(html, "srcset")) {
              references.push(...srcset.split(",").map((candidate) => candidate.trim().split(/\s+/, 1)[0]))
            }

            const imageMetaTags = [...html.matchAll(/<meta\b[^>]*(?:property|name)=["'](?:og:image(?::url)?|twitter:image)["'][^>]*>/gi)]
            for (const match of imageMetaTags) {
              const content = match[0].match(/\bcontent=["']([^"']+)["']/i)?.[1]
              if (content) references.push(content)
            }

            for (const reference of new Set(references)) {
              await checkReference(reference, file, route)
            }

            if (/<meta name="generator" content="Quartz"/i.test(html)) {
              const documentIds = new Set(attributeValues(html, "id"))
              const canonicalTags = [...html.matchAll(/<link\b[^>]*\brel=["'][^"']*\bcanonical\b[^"']*["'][^>]*>/gi)]
              const canonical = canonicalTags[0]?.[0].match(/\bhref=["']([^"']+)["']/i)?.[1]
              const expectedCanonical = new URL(route, siteOrigin).toString()
              if (canonicalTags.length !== 1 || canonical !== expectedCanonical) {
                failures.push(`${file}: canonical is ${canonical ?? "missing"}; expected ${expectedCanonical}`)
              }

              const title = html.match(/<title>([\s\S]*?)<\/title>/i)?.[1]
              if (!title || !(title.startsWith("Endurance") || title.endsWith(" · Endurance"))) {
                failures.push(`${file}: title lacks Endurance branding`)
              }

              const head = html.split(/<\/head>/i, 1)[0]
              if (/quartz\.jzhao\.xyz/i.test(head)) failures.push(`${file}: Quartz URL in <head>`)
              if (/content=["']image\/\./i.test(head)) failures.push(`${file}: malformed image MIME type`)
              if (/static\/og-image\.png/i.test(head)) failures.push(`${file}: legacy Quartz OG image in <head>`)

              const mainTags = [...html.matchAll(/<main\b[^>]*>/gi)].map((match) => match[0])
              if (mainTags.length !== 1 || attributeValue(mainTags[0] ?? "", "id") !== "quartz-content") {
                failures.push(`${file}: expected exactly one main#quartz-content`)
              }

              const h1Count = [...html.matchAll(/<h1\b[^>]*>/gi)].length
              if (h1Count !== 1) failures.push(`${file}: expected exactly one h1; found ${h1Count}`)

              const skipLinks = [...html.matchAll(/<a\b[^>]*>/gi)]
                .map((match) => match[0])
                .filter((link) => hasClass(link, "skip-link"))
              if (skipLinks.length !== 1 || attributeValue(skipLinks[0] ?? "", "href") !== "#quartz-content") {
                failures.push(`${file}: expected one skip-link to #quartz-content`)
              }

              const hasStandardNavigation = file !== "404.html"
              checkControlledButtons(html, file, "search-button", documentIds, hasStandardNavigation)
              checkControlledButtons(html, file, "explorer-toggle", documentIds, hasStandardNavigation)
              checkControlledButtons(html, file, "toc-header", documentIds, false)
            }
          }

          const verificationFile = "google22975f70551c2949.html"
          const verification = await fs.readFile(path.join(outputRoot, verificationFile), "utf8")
          if (verification.trim() !== `google-site-verification: ${verificationFile}`) {
            failures.push(`${verificationFile}: invalid verification content`)
          }
          if (fileSet.has("google22975f70551c2949")) {
            failures.push("extensionless Google verification artifact must not be published")
          }

          const cname = await fs.readFile(path.join(outputRoot, "CNAME"), "utf8")
          if (cname.trim() !== "endurancege.ru") failures.push("CNAME must contain endurancege.ru")

          const privateLibraryPattern = /(?:^|\/)adds\/adds_pdf\/(?:PhysicsTheory|Генденштейн[^/]*|ЯКОВЛЕВ книга)\.pdf$/u
          for (const file of files.filter((candidate) => privateLibraryPattern.test(candidate))) {
            failures.push(`${file}: private PDF library was published`)
          }
          for (const publicPdf of ["adds/adds_pdf/Codificator.pdf", "adds/adds_pdf/Demo-version.pdf"]) {
            if (!fileSet.has(publicPdf)) failures.push(`${publicPdf}: required public PDF is missing`)
          }

          if (failures.length > 0) {
            console.error(`Site validation failed with ${failures.length} problem(s):`)
            failures.slice(0, 100).forEach((failure) => console.error(`- ${failure}`))
            process.exit(1)
          }

          console.log(`Validated ${htmlFiles.length} HTML files and ${files.length} generated files`)
          NODE

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
